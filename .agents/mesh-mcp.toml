# mesh-mcp.toml — Generated by 'mesh-mcp init --auto'
[workspace]
name = "causalmesh"
version = "6.0.0"
workspace_root = "${WORKSPACE_ROOT:-..}"
roots = ["../crates/*", "../deploy*", "../docs", "../k8s*"]

[engines.docs]
enabled = true
paths = ["${workspace_root}/docs"]
exact_phrase_boost = 60
fuzzy_fallback = true

[engines.contracts]
enabled = true

[engines.policy]
enabled = true
enforce_git_hooks = true
cryptographic_audit_trail = true

[engines.policy.stop_rules]
"deploy" = "🛑 STOP INFRASTRUCTURE : Deployment manifests in 'deploy' require infrastructure review!"
