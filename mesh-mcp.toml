# mesh-mcp.toml — annotated reference configuration
#
# This is the full-featured example referenced by SETUP.md. It targets a monorepo laid out as
# proto-registry / api-gateway / services/* / k8s-infrastructure / docs — adapt the roots to
# yours. Every section below is optional except [workspace].
#
# Paths are resolved relative to THIS FILE's directory, not your shell's working directory.

[workspace]
name = "enterprise-polyglot-mesh"
version = "1.0.0"

workspace_root = "${WORKSPACE_ROOT:-.}"
roots = [
  "${workspace_root}/proto-registry",
  "${workspace_root}/api-gateway",          # TypeScript / NestJS
  "${workspace_root}/services/*",           # Globs for microservices
  "${workspace_root}/k8s-infrastructure",    # YAML / Kubernetes Manifests
  "${workspace_root}/docs"                  # Markdown / C4 Architecture
]

exclude_patterns = [
  "**/.env*",
  "**/secrets/**",
  "**/*.pem",
  "**/*.key",
  "**/id_rsa*",
  "**/id_ed25519*",
  "**/id_ecdsa*",
  "**/.npmrc",
  "**/.pypirc",
  "**/.dockercfg",
  "**/.docker/**",
  "**/.kube/**",
  "**/*.jks",
  "**/*.p12",
  "**/*.pfx",
  "**/*.keystore",
  "**/node_modules/**",
  "**/target/**",
  "**/build/**",
  "**/.venv/**",
  "**/.git/**"
]

# ==============================================================================
# Engine 1: Documentation Engine (C4, ADRs, RFCs)
# ==============================================================================
[engines.docs]
enabled = true
paths = ["${workspace_root}/docs", "${workspace_root}/architecture"]
aliases = { "ws" = "websocket", "k8s" = "kubernetes", "dlq" = "dead-letter-queue", "auth" = "authentication" }
stop_words = ["comment", "pourquoi", "dans", "avec", "how", "what", "which", "the"]
exact_phrase_boost = 60
fuzzy_fallback = true
sanitize_prompt_injections = true

# ==============================================================================
# Engine 2: Formal Schema & Properties Engine (Protobuf / OpenAPI / AsyncAPI / Spring)
# ==============================================================================
[engines.contracts]
enabled = true

[engines.contracts.grpc]
proto_dirs = ["${workspace_root}/proto-registry/proto"]
controller_annotations = ["@GrpcMethod", "@GrpcService"]
canonical_fqcn_projection = true

[engines.contracts.spring]
enabled = true
property_files = [
  "**/src/main/resources/application*.yml",
  "**/src/main/resources/application*.properties"
]
resolve_placeholders = true
auto_redact_secrets = true

[engines.contracts.openapi]
enabled = true
spec_files = ["${workspace_root}/api-gateway/docs/openapi.yaml"]

[engines.contracts.asyncapi]
enabled = true
spec_files = ["${workspace_root}/docs/asyncapi.yaml"]
infer_string_topics = true

# ==============================================================================
# Declarative Custom Pattern Engine (Zero-Hardcoding Polyglot Mapping)
# Map your custom CQRS outboxes, BullMQ jobs, sagas, and event listeners via regex:
# ==============================================================================
# [[engines.contracts.patterns]]
# name = "transactional-outbox"
# kind = "topic_producer" # topic_producer | topic_consumer | saga | rpc
# file_pattern = "*.ts"
# regex = 'createEvent<([^>]+)>'
# target_group = 1

# [[engines.contracts.patterns]]
# name = "event-post-processor"
# kind = "topic_consumer"
# file_pattern = "*.ts"
# regex = 'class\s+(\w+)\s+extends\s+\w*PostProcessor<([^>]+)>'
# target_group = 2
# consumer_group = 1

# [[engines.contracts.patterns]]
# name = "saga-coordinator"
# kind = "saga"
# file_pattern = "*.ts"
# regex = 'class\s+(\w+Saga)\b'
# target_group = 1

# ==============================================================================
# Engine 3: Policy Steering, Audit & Git Enforcement (Active Defense)
# ==============================================================================
[engines.policy]
enabled = true
enforce_git_hooks = true
cryptographic_audit_trail = true

[engines.policy.stop_rules]
"proto-registry" = "🛑 STOP CASCADE CI : proto-registry génère les stubs TS/Go/Java. Ne touche pas aux microservices !"
"k8s-infrastructure" = "🛑 STOP INFRASTRUCTURE : Modification des manifests K8s sous revue DevOps obligatoire !"

# ------------------------------------------------------------------------------
# Project skills: hand the agent your playbook before it proposes a change.
#
# Key   = an MCP tool name (smart_search, find_dependents, analyze_grpc,
#         analyze_impact, search_docs), or any fragment of the scope/target queried.
#         Exact tool names win over path fragments; among path fragments the longest wins.
# Value = a Markdown file. Its `description:` frontmatter (or first `# H1`) is quoted
#         inline in the tool response so the agent can judge relevance before opening it.
#
# `mesh-mcp doctor` reports any key whose file is missing — without that check a typo
# would silently never recommend anything.
# ------------------------------------------------------------------------------
# Commented out because these example files do not exist in this repository:
# point the keys at playbooks you actually have, then run `mesh-mcp doctor` to confirm.
# [engines.policy.skills]
# "proto-registry" = ".agents/skills/proto-contract-evolution.md"
# "k8s-infrastructure" = ".agents/skills/k8s-manifest-review.md"

# ==============================================================================
# Parse cache (per workspace)
# ==============================================================================
# Quota of ~/.cache/mesh-mcp/workspaces/<workspace_id>/index-cache.db (database + WAL), in MiB.
# Over quota, the least recently used entries are evicted down to 80 % of it.
[cache]
max_size_mb = 2048
