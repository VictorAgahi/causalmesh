[package]
name = "mesh-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "meshd"
path = "src/main.rs"

[dependencies]
mesh-core.workspace = true
mesh-parsers.workspace = true
mesh-server.workspace = true

arc-swap.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
clap.workspace = true
thiserror.workspace = true
dunce.workspace = true
once_cell.workspace = true
mimalloc.workspace = true
libc.workspace = true
tempfile.workspace = true

# Plan 4 step 4.10: kernel-level network sandbox (seccomp-bpf), Linux only.
[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "0.5"

[dev-dependencies]
tempfile.workspace = true
# Enables mesh-server's test-only "test_slow_op" tool for daemon concurrency
# tests. Cargo's per-target feature resolution (resolver = "2") keeps this
# off for the `meshd` release binary, which only pulls in the [dependencies]
# entry above.
mesh-server = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
