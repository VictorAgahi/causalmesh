[package]
name = "mesh-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
default-run = "mesh-mcp"

[[bin]]
name = "mesh-mcp"
path = "src/main.rs"

[[bench]]
name = "real_benchmarks"
harness = false

[features]
# Test-only instrumentation (e.g. a deliberately slow MCP tool used by
# mesh-daemon's concurrency tests). Never enabled for the release binary.
test-util = []

[dependencies]
