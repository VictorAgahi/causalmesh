name: MeshMCP Enterprise CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ============================================================================
  # 1. Code Quality & Linter Invariants
  # ============================================================================
  code-quality:
    name: "Code Quality & Strict Lints"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Install Rust stable"
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: "Rust Cache"
        uses: Swatinem/rust-cache@v2

      - name: "Invariant Check: Rustfmt (Code Formatting)"
        run: cargo fmt --all -- --check

      - name: "Invariant Check: Strict Clippy (-D warnings)"
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ============================================================================
  # 2. Cross-Platform Multi-OS Test Suite (33 Tests)
  # ============================================================================
  test-suite:
    name: "Test Suite (${{ matrix.os }})"
    needs: code-quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Install Rust stable"
        uses: dtolnay/rust-toolchain@stable

      - name: "Rust Cache"
        uses: Swatinem/rust-cache@v2

      - name: "Run Workspace Tests (Core, Parsers, Server, Integration)"
        run: cargo test --workspace --verbose

  # ============================================================================
  # 2b. Determinism Gate (idempotence invariants I1-I3, P0 steps 1.1-1.5)
  # ============================================================================
  # Indexes each example workspace 5x sequentially and 8x concurrently and
  # requires a single content fingerprint per workspace (scripts/determinism.sh).
  # Blocking: every measured workspace (examples, and — checked manually, not
  # committed here — Bank of Anthos, the OpenTelemetry demo, Online Boutique) is
  # fully deterministic as of P0 step 1.5. A regression here is a real bug.
  determinism:
    name: "Determinism Gate (${{ matrix.os }})"
    needs: test-suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Install Rust stable"
        uses: dtolnay/rust-toolchain@stable

      - name: "Rust Cache"
        uses: Swatinem/rust-cache@v2

      - name: "Compile Release Binary"
        run: cargo build --release -p mesh-server

      - name: "One fingerprint per workspace across sequential and concurrent runs"
        run: scripts/determinism.sh

  # ============================================================================
  # 3. Production Release Build & Smoke Test
  # ============================================================================
  release-smoke-test:
    name: "Release Build & Doctor Verification (${{ matrix.os }})"
    needs: test-suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Install Rust stable"
        uses: dtolnay/rust-toolchain@stable

      - name: "Rust Cache"
        uses: Swatinem/rust-cache@v2

      - name: "Compile Release Binary with Thin LTO & mimalloc"
        run: cargo build --workspace --release

      - name: "Smoke Test: Version Check"
        run: ./target/release/mesh-mcp --version

      - name: "Smoke Test: Diagnostic Doctor"
        run: ./target/release/mesh-mcp doctor

      - name: "Smoke Test: JSON-RPC Stdio Handshake Loopback"
        shell: bash
        run: |
          PAYLOAD='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci-smoke-test","version":"1.0.0"}}}'
          RESPONSE=$(echo "$PAYLOAD" | ./target/release/mesh-mcp run)
          echo "Server Response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"jsonrpc":"2.0"'
          echo "$RESPONSE" | grep -E -q '"name":"(mesh-mcp|meshd)"'
          echo "✔ Stdio JSON-RPC protocol loopback verified successfully."

  # ============================================================================
  # 4. Packaging & Enterprise Tooling Syntax Validation
  # ============================================================================
  tooling-validation:
    name: "Tooling & Daemon Syntax Check"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "Validate NPM Runner Syntax (bin/mesh-mcp.js)"
        run: node -c bin/mesh-mcp.js

      - name: "Validate Systemd Service Unit Syntax"
        run: |
          test -f deploy/systemd/mesh-mcp.service
          grep -q "MemoryMax=256M" deploy/systemd/mesh-mcp.service
          grep -q "IOWeight=20" deploy/systemd/mesh-mcp.service
          echo "✔ Systemd cgroups v2 unit validated."

      - name: "Validate macOS Launchd Plist Syntax"
        run: |
          test -f deploy/launchd/com.causalmesh.mcp.plist
          grep -q "<string>Background</string>" deploy/launchd/com.causalmesh.mcp.plist
          grep -q "LowPriorityIO" deploy/launchd/com.causalmesh.mcp.plist
          echo "✔ macOS launchd plist validated."
